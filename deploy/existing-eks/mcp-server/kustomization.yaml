# arc-intel on an existing EKS cluster that already runs ARC (Helm) and Kagent.
# No Argo CD: desired state comes from the ARC Helm releases. No External Secrets needed.
# demo/scripts/setup-existing-eks.sh fills in IMAGE, AWS_REGION and CLUSTER_NAME.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../mcp-server
images:
  - name: ghcr.io/my-org/arc-intel-mcp
    newName: IMAGE_REPO
    newTag: IMAGE_TAG
configMapGenerator:
  - name: arc-intel-policy
    behavior: replace
    files: [policy.yaml]
patches:
  - target: {kind: Deployment, name: arc-intel-mcp}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: AWS_REGION, value: AWS_REGION_VALUE}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: EKS_AUDIT_LOG_GROUP, value: /aws/eks/CLUSTER_NAME_VALUE/cluster}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: AUDIT_LOOKBACK_HOURS, value: "168"}
