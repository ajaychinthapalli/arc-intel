---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-intel-monitoring
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "2"}
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: arc-platform
  source:
    repoURL: https://github.com/my-org/arc-intel.git
    targetRevision: main
