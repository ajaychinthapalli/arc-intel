# External Secrets Operator + the platform secrets it syncs from AWS Secrets Manager.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-3"}
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: arc-platform
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: "2.13.0"
    helm:
      valuesObject:
        serviceAccount: {name: external-secrets}   # EKS Pod Identity association targets this name
        installCRDs: true
  destination: {server: https://kubernetes.default.svc, namespace: external-secrets}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secrets
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: arc-platform
  source:
    repoURL: https://github.com/ajaychinthapalli/arc-intel.git
    targetRevision: main
    path: clusters/ac-ws-dev-use2/manifests/platform-secrets
  destination: {server: https://kubernetes.default.svc, namespace: arc-runners}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [SkipDryRunOnMissingResource=true]
    retry: {limit: 10, backoff: {duration: 15s, factor: 2, maxDuration: 3m}}
