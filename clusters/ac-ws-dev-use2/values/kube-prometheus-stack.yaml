# kube-prometheus-stack for ac-ws-dev-use2.
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false   # pick up arc-intel's ServiceMonitor
    ruleSelectorNilUsesHelmValues: false             # and its PrometheusRule
    retention: 15d
    externalLabels: {cluster: ac-ws-dev-use2}
    # Fleet-wide metrics in Amazon Managed Service for Prometheus (optional): add remoteWrite with
    # sigv4 and a Pod Identity association for this ServiceAccount (see deploy/eks/monitoring).
grafana:
  enabled: true
  # Admin password: kubectl -n monitoring get secret kube-prometheus-stack-grafana -o jsonpath='{.data.admin-password}' | base64 -d
alertmanager:
  enabled: true
  # Route alerts to on-call: set alertmanager.config receivers (Slack, PagerDuty, Opsgenie).
# EKS: the control plane is AWS-managed and not scrapeable. Disabling these also stops the chart
# from creating Services in kube-system, which the arc-platform project does not allow.
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeEtcd: {enabled: false}
kubeProxy: {enabled: false}
coreDns: {enabled: false}
