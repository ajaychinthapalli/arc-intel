    syncOptions: [SkipDryRunOnMissingResource=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-intel-digest
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "3"}
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: arc-platform
  source:
    repoURL: https://github.com/my-org/arc-intel.git
    targetRevision: main
    path: deploy/digest              # weekday CronJob: asks the agent over A2A, posts to Slack
  destination: {server: https://kubernetes.default.svc, namespace: kagent}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
