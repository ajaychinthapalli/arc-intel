# GitHub App credentials live in AWS Secrets Manager (secret "arc/github-app", JSON with keys
# github_app_id, github_app_installation_id, github_app_private_key) and are synced by
# External Secrets Operator using EKS Pod Identity. Nothing sensitive is committed to Git.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-west-2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: arc-github-app          # referenced by githubConfigSecret (passes ARC-001)
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: arc/github-app
