# Secrets Manager -> Kubernetes, via External Secrets Operator (EKS Pod Identity, no keys).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: __REGION__
---
# GitHub config for the runner scale sets (App credentials, or a PAT until you move to an App).
# Merge: the Secret the scale sets already use stays in place (no listener restart); ESO keeps its
# data in sync with Secrets Manager from now on.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: __GITHUB_SECRET_NAME__
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: aws-secrets-manager}
  target: {name: __GITHUB_SECRET_NAME__, creationPolicy: Merge}
  dataFrom:
    - extract: {key: arc/github-app}
---
# Runner egress policy (ARC-014). Tighten the allow-all rule to GitHub, ECR and package registries.
# Enforced only when the vpc-cni add-on has enableNetworkPolicy=true.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runners-egress
  namespace: arc-runners
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - {}
