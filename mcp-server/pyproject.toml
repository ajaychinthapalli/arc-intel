[project]
name = "arc-intel"
version = "0.1.0"
description = "ARC (Actions Runner Controller) configuration compliance & drift intelligence — MCP tools for Kagent"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.2,<3",
  "kubernetes>=31",
  "prometheus-client>=0.21",
  "PyYAML>=6",
]

[project.optional-dependencies]
aws = ["boto3>=1.35"]   # EKS: CloudWatch audit-log identity lookup (EKS Pod Identity credentials)
dev = ["pytest>=8"]

[project.scripts]
arc-intel = "arc_intel.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["arc_intel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
